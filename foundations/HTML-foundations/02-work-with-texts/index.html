<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Works with Texts</title>
    </head>

    <body>
        <h1>Heading 1 title</h1>
        <h2>Heading 2 title</h2>
        <h3>Heading 3 title</h3>
        <h4>Heading 4 title</h4>
        <h5>Heading 5 title</h5>
        <h6>Heading 6 title</h6>

        <!-- bold text section -->
        <strong>BOLD TEXT!!!!</strong>
        <p>this is how to create <strong>BOLD TEXT</strong> in a paragraph.</p>

        <!-- italic text section -->
        <em>ITALIC TEXT</em>
        <p>this is how to create <em>ITALIC TEXT</em> in a paragraph.</p>
    </body>
</html>
