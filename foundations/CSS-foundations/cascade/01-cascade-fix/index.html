<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>The Odin Project: Cascade</title>
        <link rel="stylesheet" href="style.css" >
    </head>
    <body>
        <p class="bold-paragraph">I'm just a paragraph with extra bold text!</p>
        <p class="bold-paragraph small-size">I'm a smaller paragraph, also with extra bold text!</p>
        <div>
            <button class="confirm-button">Confirm</button>
            <button>Cancel</button>
        </div>
        <div class="thin-div">I'm a div with thin text!</div>
        <div class="thin-div">
            <div class="child-div">I'm a div with thin text and a child div</div>
            <div class="bold-paragraph small-size">I'm a smaller child div with extra bold text.</div>
            <div class="bold-paragraph ">I'm another child div with extra bold text.</div>
        </div>
    </body>
</html>
